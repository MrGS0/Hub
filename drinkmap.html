const { useState, useEffect, useRef } = React;

const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
const today = () => new Date().toISOString().slice(0, 10);
const isMobile = () => window.innerWidth < 860;
const isDrawn = (z) => !!(z && z.pts && z.pts.length >= 3);

// GeoJSON FeatureCollection -> internal [{...props, pts:[[lat,lng],...]|null}]
function fromGeoJSON(fc) {
  const feats = (fc && Array.isArray(fc.features)) ? fc.features : [];
  return feats.map((f, i) => {
    const p = f.properties || {};
    let pts = null;
    const g = f.geometry;
    if (g && g.type === 'Polygon' && g.coordinates && g.coordinates[0] && g.coordinates[0].length >= 3) {
      const ring = g.coordinates[0].map((c) => [c[1], c[0]]);
      const a = ring[0], b = ring[ring.length - 1];
      if (ring.length > 3 && a[0] === b[0] && a[1] === b[1]) ring.pop();
      pts = ring;
    }
    return {
      id: p.id || f.id || ('zone-' + i), name: p.name || '', group: p.group || '',
      type: TYPES.includes(p.type) ? p.type : 'ban', time: p.time || '',
      rules: p.rules || '', rules_en: p.rules_en || '', source: p.source || '',
      sourceLabel: p.sourceLabel || '', map: p.map || '', checked: p.checked || '',
      notes: p.notes || '', pts,
    };
  });
}

function toGeoJSON(zones) {
  return {
    type: 'FeatureCollection',
    meta: Object.assign({}, ZONES.meta, { exported: new Date().toISOString() }),
    features: zones.map((z) => {
      const { pts, ...props } = z;
      let geometry = null;
      if (isDrawn(z)) {
        const ring = pts.map((p) => [+p[1].toFixed(6), +p[0].toFixed(6)]);
        ring.push(ring[0]);
        geometry = { type: 'Polygon', coordinates: [ring] };
      }
      return { type: 'Feature', id: z.id, properties: props, geometry };
    }),
  };
}

async function loadData() {
  let published = fromGeoJSON(ZONES), src = 'embedded';
  try {
    const r = await fetch(DATA_FILE, { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j && Array.isArray(j.features)) { published = fromGeoJSON(j); src = 'file'; }
    }
  } catch (e) { /* file:// or missing file -> embedded */ }
  let draft = null;
  if (EDIT) {
    const raw = lsGet(LS_ZONES);
    if (raw) { try { const j = JSON.parse(raw); if (j && Array.isArray(j.features)) draft = fromGeoJSON(j); } catch (e) {} }
  }
  return { published, draft, src };
}

function Swatch({ type, small }) {
  const s = small ? 14 : 18;
  return (
    <svg className="sw" width={s} height={s} viewBox="0 0 18 18" aria-hidden="true">
      <rect x="1" y="1" width="16" height="16" rx="4" fill={`url(#p-${type})`} stroke={TYPE_COLOR[type]} strokeWidth="1.5" />
    </svg>
  );
}

function Badge({ type, t }) {
  return <span className="badge"><Swatch type={type} />{t.types[type]}</span>;
}

function Home({ t, zones, dark, setDark, onList }) {
  const drawn = zones.filter(isDrawn).length;
  return (
    <div>
      <p>{t.intro1}</p>
      <p>{t.intro2}</p>
      <p>{t.intro3}</p>
      <div className="legend">
        {TYPES.map((k) => <div className="lg" key={k}><Swatch type={k} /><span>{t.types[k]}</span></div>)}
        <div className="lg"><span className="sw none" /><span>{t.outside}</span></div>
      </div>
      <p className="small mute">{t.stats(drawn, zones.length)}{ZONES.meta && ZONES.meta.sourceUpdated && <span> {t.sourceUpdated} <span className="mono">{ZONES.meta.sourceUpdated}</span>.</span>}</p>
      <p className="small mute">{t.disclaimer}</p>
      <p className="small"><a href={SRC} target="_blank" rel="noopener">{t.officialSource}</a></p>
      <div className="btnrow">
        <button className="btn ghost" onClick={onList}>{t.allZones}</button>
        <button className="btn ghost" onClick={() => setDark(!dark)}>{dark ? t.lightMap : t.darkMap}</button>
      </div>
    </div>
  );
}

function ZoneInfo({ z, t, lang }) {
  const rules = lang === 'en' ? (z.rules_en || z.rules) : z.rules;
  return (
    <div>
      <div className="meta-row"><Badge type={z.type} t={t} />{z.group && <span className="grp-tag">{z.group}</span>}</div>
      {z.type === 'ban_time' && z.time && <p><strong>{t.time}:</strong> {z.time}</p>}
      {rules && <p>{rules}</p>}
      {lang === 'en' && !z.rules_en && z.rules && <p className="small mute">{t.rulesInSwedish}</p>}
      {!isDrawn(z) && <p className="small mute">{t.notDrawnLong}</p>}
      <dl className="facts">
        {z.source && <React.Fragment><dt>{t.source}</dt><dd><a href={z.source} target="_blank" rel="noopener">{z.sourceLabel || z.source}</a></dd></React.Fragment>}
        {z.map && <React.Fragment><dt>{t.kommunMap}</dt><dd><a href={z.map} target="_blank" rel="noopener">PDF</a></dd></React.Fragment>}
        {z.checked && <React.Fragment><dt>{t.checked}</dt><dd className="mono">{z.checked}</dd></React.Fragment>}
        {z.notes && <React.Fragment><dt>{t.notes}</dt><dd>{z.notes}</dd></React.Fragment>}
      </dl>
    </div>
  );
}

function ZoneEdit({ z, t, groups, onChange, onDelete, onRedraw, selVertex, onRemoveVertex, onDone }) {
  const F = (k, kind, type) => (
    <label className="f" key={k}>
      <span>{t.fields[k]}</span>
      {kind === 'textarea'
        ? <textarea value={z[k] || ''} onChange={(e) => onChange({ [k]: e.target.value })} />
        : <input type={type || 'text'} list={k === 'group' ? 'groups' : undefined} value={z[k] || ''} onChange={(e) => onChange({ [k]: e.target.value })} />}
    </label>
  );
  const drawn = isDrawn(z);
  return (
    <div>
      <p className="small mute">{drawn ? t.vertexHint : t.notDrawnLong}</p>
      <div className="btnrow">
        {drawn && <button className="btn ghost small" disabled={selVertex == null || z.pts.length <= 3} onClick={onRemoveVertex}>{t.removeVertex}</button>}
        <button className="btn ghost small" onClick={onRedraw}>{drawn ? t.redraw : t.draw}</button>
      </div>
      {F('name')}
      {F('group')}
      <datalist id="groups">{groups.map((g) => <option key={g} value={g} />)}</datalist>
      <label className="f">
        <span>{t.fields.type}</span>
        <select value={z.type} onChange={(e) => onChange({ type: e.target.value })}>
          {TYPES.map((k) => <option key={k} value={k}>{t.types[k]}</option>)}
        </select>
      </label>
      {z.type === 'ban_time' && F('time')}
      {F('rules', 'textarea')}
      {F('rules_en', 'textarea')}
      {F('sourceLabel')}
      {F('source', 'input', 'url')}
      {F('map', 'input', 'url')}
      {F('checked', 'input', 'date')}
      {F('notes', 'textarea')}
      <div className="btnrow" style={{ marginTop: 14 }}>
        <button className="btn" onClick={onDone}>{t.doneEditing}</button>
        <button className="btn danger small" onClick={onDelete}>{t.deleteZone}</button>
      </div>
    </div>
  );
}

function ZoneList({ zones, t, mode, selectedId, onSelect, onDraw }) {
  if (!zones.length) return <div className="empty">{t.noZones}</div>;
  const order = [], by = {};
  zones.forEach((z) => { const g = z.group || '–'; if (!by[g]) { by[g] = []; order.push(g); } by[g].push(z); });
  return (
    <div>
      {order.map((g) => (
        <div key={g}>
          <div className="grp">{g}</div>
          {by[g].map((z) => {
            const drawn = isDrawn(z);
            return (
              <div key={z.id} className={'row' + (z.id === selectedId ? ' on' : '')}>
                <button className="rowbtn" onClick={() => onSelect(z.id, drawn)}>
                  {drawn ? <Swatch type={z.type} small /> : <span className="sw none small" />}
                  <span className="nm">{z.name || `(${t.unnamed})`}</span>
                  {!drawn && <span className="st">{t.notDrawn}</span>}
                </button>
                {mode === 'edit' && !drawn && <button className="btn small" onClick={() => onDraw(z.id)}>{t.draw}</button>}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function Editor({ t, zones, usingDraft, dataSrc, selectedId, onNew, onExport, onImportClick, onReset, onSelect, onDraw }) {
  return (
    <div>
      <div className={'status' + (usingDraft ? ' draft' : '')}>
        {usingDraft ? t.draft : `${t.publishedData} (${dataSrc === 'file' ? t.fromFile : t.fromEmbedded}).`}
      </div>
      <div className="btnrow">
        <button className="btn" onClick={onNew}>{t.newZone}</button>
        <button className="btn ghost" onClick={onExport}>{t.exportBtn}</button>
        <button className="btn ghost" onClick={onImportClick}>{t.importBtn}</button>
        {usingDraft && <button className="btn danger small" onClick={onReset}>{t.resetDraft}</button>}

      <details className="pdfs">
        <summary>{t.pdfMaps}</summary>
        <ul>{PDFS.map(([n, u]) => <li key={u}><a href={u} target="_blank" rel="noopener">{n}</a></li>)}</ul>
      </details>
      <ZoneList zones={zones} t={t} mode="edit" selectedId={selectedId} onSelect={onSelect} onDraw={onDraw} />

  );
}

function DrawBar({ t, n, name, onUndo, onCancel, onSave }) {
  return (
    <div className="drawbar">
      <div className="grow">
        <div className="hint">{name || t.newZone}</div>
        <div className="mono">{n} {t.points}</div>
      </div>
      <button className="btn ghost small" onClick={onUndo} disabled={!n}>{t.undoPoint}</button>
      <button className="btn ghost small" onClick={onCancel}>{t.cancel}</button>

function App() {
  const [zones, setZones] = useState(null);
  const [published, setPublished] = useState(null);
  const [usingDraft, setUsingDraft] = useState(false);
  const [dataSrc, setDataSrc] = useState('');
  const [lang, setLang] = useState(() => (lsGet(LS_LANG) === 'en' ? 'en' : 'sv'));
  const [mode, setMode] = useState('view');       // view | edit
  const [view, setView] = useState('home');       // home | list | zone
  const [selectedId, setSelectedId] = useState(null);
  const [drawing, setDrawing] = useState(null);   // { targetId, pts }
  const [selVertex, setSelVertex] = useState(null);
  const [collapsed, setCollapsed] = useState(false);
  const [dark, setDark] = useState(false);
  const [toast, setToast] = useState(null);

  const t = T[lang];
  const mapEl = useRef(null), mapRef = useRef(null);
  const layers = useRef({}), polyRef = useRef({}), tiles = useRef({});
  const fileRef = useRef(null), toastTimer = useRef(null), fitRef = useRef(null);
  const st = useRef({});
  st.current = { zones, mode, drawing, selectedId, selVertex, view, t };

  const sel = zones ? zones.find((z) => z.id === selectedId) || null : null;
  const groups = zones ? [...new Set(zones.map((z) => z.group).filter(Boolean))] : [];

  // ---- data ----
  const commit = (next) => {
    setZones(next);
    if (EDIT) { lsSet(LS_ZONES, JSON.stringify(toGeoJSON(next))); setUsingDraft(true); }
  };
  const commitZone = (id, patch) => {
    const cur = st.current.zones || [];
    commit(cur.map((z) => (z.id === id ? Object.assign({}, z, patch) : z)));
  };
  const showToast = (msg, ms) => {
    setToast(msg); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), ms || 3000);
  };
  const setLangP = (l) => { setLang(l); lsSet(LS_LANG, l); document.documentElement.lang = l; };

  useEffect(() => {
    document.documentElement.lang = lang;
    loadData().then(({ published, draft, src }) => {
      setPublished(published); setDataSrc(src);
      setZones(draft || published); setUsingDraft(!!draft);
    });
  }, []);

  // ---- map init ----
  useEffect(() => {
    const map = L.map(mapEl.current, { zoomControl: false, attributionControl: false }).setView(UMEA_CENTER, 13);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.control.attribution({ position: isMobile() ? 'topleft' : 'bottomleft', prefix: false }).addTo(map);
    tiles.current.light = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' });
    tiles.current.dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>' });
    tiles.current.light.addTo(map);
    layers.current.zones = L.layerGroup().addTo(map);
    layers.current.draw = L.layerGroup().addTo(map);
    layers.current.handles = L.layerGroup().addTo(map);
    map.on('click', (e) => {
      const s = st.current;
      if (s.drawing) {
        setDrawing((d) => (d ? Object.assign({}, d, { pts: [...d.pts, [e.latlng.lat, e.latlng.lng]] }) : d));
        return;
      }
      if (s.mode === 'view') { setSelectedId(null); setView('home'); }
    });
    mapRef.current = map;
    return () => map.remove();
  }, []);

  useEffect(() => {
    const map = mapRef.current; if (!map) return;
    const { light, dark: dk } = tiles.current;
    if (dark) { map.removeLayer(light); dk.addTo(map); } else { map.removeLayer(dk); light.addTo(map); }
  }, [dark]);

  // ---- zones on the map ----
  useEffect(() => {
    const map = mapRef.current; if (!map || !zones) return;
    const lg = layers.current.zones; lg.clearLayers(); polyRef.current = {};
    zones.forEach((z) => {
      if (!isDrawn(z)) return;
      const isSel = z.id === selectedId;
      const poly = L.polygon(z.pts, {
        className: 'zone zone-' + z.type + (isSel ? ' sel' : ''),
        color: TYPE_COLOR[z.type], weight: isSel ? 3 : 1.5,
        interactive: !drawing, bubblingMouseEvents: false,
      });
      poly.on('click', () => { setSelVertex(null); setSelectedId(z.id); setView('zone'); setCollapsed(false); });
      poly.addTo(lg); polyRef.current[z.id] = poly;
    });
    if (selectedId && polyRef.current[selectedId]) polyRef.current[selectedId].bringToFront();
  }, [zones, selectedId, drawing]);

  // fit to a zone selected from the list
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !zones || fitRef.current !== selectedId) return;
    fitRef.current = null;
    const z = zones.find((x) => x.id === selectedId);
    if (!isDrawn(z)) return;
    map.fitBounds(L.latLngBounds(z.pts), {
      paddingTopLeft: [24, 24],
      paddingBottomRight: [24, isMobile() ? Math.round(map.getSize().y * 0.5) : 24],
      maxZoom: 17,
    });
  }, [selectedId, zones]);

  // ---- drawing overlay ----
  useEffect(() => {
    const lg = layers.current.draw; if (!lg) return;
    lg.clearLayers();
    if (!drawing) return;
    const pts = drawing.pts;
    if (pts.length > 2) L.polygon(pts, { className: 'zone zone-draft', interactive: false, weight: 0 }).addTo(lg);
    if (pts.length > 1) L.polyline(pts, { color: '#141A17', weight: 2, dashArray: '6 6', interactive: false }).addTo(lg);
    if (pts.length > 2) L.polyline([pts[pts.length - 1], pts[0]], { color: '#141A17', weight: 1, opacity: .6, dashArray: '2 6', interactive: false }).addTo(lg);
    pts.forEach((p, i) => {
      const first = i === 0;
      const m = L.marker(p, { icon: L.divIcon({ className: 'dp' + (first ? ' first' : ''), iconSize: first ? [18, 18] : [10, 10] }), interactive: first, keyboard: false });
      if (first) m.on('click', () => finishDrawing());
      m.addTo(lg);
    });
  }, [drawing]);

  // ---- vertex handles for the zone being edited ----
  useEffect(() => {
    const lg = layers.current.handles; if (!lg) return;
    lg.clearLayers();
    if (mode !== 'edit' || drawing || !zones) return;
    const z = zones.find((x) => x.id === selectedId);
    if (!isDrawn(z)) return;
    const pts = z.pts.map((p) => [p[0], p[1]]);
    const poly = polyRef.current[z.id];
    const n = pts.length;
    const midPos = (i) => { const a = pts[i], b = pts[(i + 1) % n]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
    const mids = pts.map((_, i) => {
      const m = L.marker(midPos(i), { icon: L.divIcon({ className: 'mh', iconSize: [12, 12] }), keyboard: false });
      m.on('click', () => {
        const np = pts.slice(); np.splice(i + 1, 0, midPos(i));
        commitZone(z.id, { pts: np }); setSelVertex(i + 1);
      });
      return m.addTo(lg);
    });
    pts.forEach((p, i) => {
      const m = L.marker(p, { draggable: true, keyboard: false,
        icon: L.divIcon({ className: 'vh' + (i === selVertex ? ' sel' : ''), iconSize: [16, 16] }) });
      m.on('click', () => setSelVertex((v) => (v === i ? null : i)));
      m.on('drag', (e) => {
        pts[i] = [e.latlng.lat, e.latlng.lng];
        if (poly) poly.setLatLngs(pts);
        mids[i].setLatLng(midPos(i)); mids[(i - 1 + n) % n].setLatLng(midPos((i - 1 + n) % n));
      });
      m.on('dragend', () => commitZone(z.id, { pts: pts.map((q) => [q[0], q[1]]) }));
      m.addTo(lg);
    });
  }, [zones, selectedId, mode, drawing, selVertex]);

  // ---- actions ----
  const selectZone = (id, fit) => {
    if (fit) fitRef.current = id;
    setSelVertex(null); setSelectedId(id); setView('zone'); setCollapsed(false);
  };
  const closeZone = () => { setSelectedId(null); setSelVertex(null); setView(mode === 'edit' ? 'home' : 'home'); };
  const toggleMode = () => {
    if (mode === 'edit') { setDrawing(null); setSelVertex(null); setMode('view'); setView('home'); }
    else { setMode('edit'); setView('home'); setCollapsed(false); }
  };
  const startDrawing = (targetId) => {
    setSelVertex(null); setSelectedId(targetId || null);
    setDrawing({ targetId: targetId || null, pts: [] });
    setCollapsed(true); showToast(t.drawHint, 6000);
  };
  const finishDrawing = () => {
    const s = st.current, d = s.drawing;
    if (!d || d.pts.length < 3) return;
    const cur = s.zones || [];
    if (d.targetId) {
      commit(cur.map((z) => (z.id === d.targetId ? Object.assign({}, z, { pts: d.pts }) : z)));
      setSelectedId(d.targetId);
    } else {
      const id = 'zone-' + Date.now().toString(36);
      commit([...cur, { id, name: '', group: '', type: 'ban', time: '', rules: '', rules_en: '',
        source: SRC, sourceLabel: SRC_LABEL, map: '', checked: today(), notes: '', pts: d.pts }]);
      setSelectedId(id);
    }
    setDrawing(null); setView('zone'); setCollapsed(false);
  };
  const cancelDrawing = () => {
    const d = drawing; setDrawing(null); setCollapsed(false);
    setView(d && d.targetId ? 'zone' : 'home');
  };
  const undoPoint = () => setDrawing((d) => (d ? Object.assign({}, d, { pts: d.pts.slice(0, -1) }) : d));
  const redrawZone = () => { if (!sel) return; commitZone(sel.id, { pts: null }); startDrawing(sel.id); };
  const removeVertex = () => {
    if (!sel || selVertex == null || sel.pts.length <= 3) return;
    commitZone(sel.id, { pts: sel.pts.filter((_, i) => i !== selVertex) }); setSelVertex(null);
  };
  const deleteZone = () => {
    if (!sel || !confirm(t.confirmDelete)) return;
    commit(zones.filter((z) => z.id !== sel.id)); setSelectedId(null); setSelVertex(null); setView('home');
  };
  const exportGeo = () => {
    const txt = JSON.stringify(toGeoJSON(st.current.zones || []), null, 2);
    const url = URL.createObjectURL(new Blob([txt], { type: 'application/geo+json' }));
    const a = document.createElement('a'); a.href = url; a.download = DATA_FILE;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
    showToast(t.exported, 7000);
  };
  const onImportFile = (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        if (!j || j.type !== 'FeatureCollection' || !Array.isArray(j.features)) throw new Error('bad');
        if (!confirm(t.importConfirm)) return;
        commit(fromGeoJSON(j)); setSelectedId(null); setView('home'); showToast(t.imported);
      } catch (err) { showToast(t.importBad); }
    };
    r.readAsText(f);
  };
  const resetDraft = () => {
    if (!confirm(t.resetConfirm)) return;
    lsDel(LS_ZONES); setZones(published); setUsingDraft(false); setSelectedId(null); setView('home');
  };

  // ---- sheet contents ----
  let head = t.loading, action = null, body = null;
  if (zones) {
    const closeBtn = <button className="btn ghost small" onClick={(e) => { e.stopPropagation(); closeZone(); }}>{t.close}</button>;
    if (view === 'zone' && sel) {
      head = sel.name || `(${t.unnamed})`; action = closeBtn;
      body = mode === 'edit'
        ? <ZoneEdit z={sel} t={t} groups={groups} selVertex={selVertex}
            onChange={(patch) => commitZone(sel.id, patch)} onDelete={deleteZone}
            onRedraw={redrawZone} onRemoveVertex={removeVertex} onDone={closeZone} />
        : <ZoneInfo z={sel} t={t} lang={lang} />;
    } else if (view === 'list') {
      head = `${t.allZones} (${zones.length})`; action = closeBtn;
      body = <ZoneList zones={zones} t={t} mode={mode} selectedId={selectedId} onSelect={selectZone} onDraw={startDrawing} />;
    } else if (mode === 'edit') {
      head = t.editing;
      action = <button className="btn small" onClick={(e) => { e.stopPropagation(); startDrawing(null); }}>{t.newZone}</button>;
      body = <Editor t={t} zones={zones} usingDraft={usingDraft} dataSrc={dataSrc} selectedId={selectedId}
        onNew={() => startDrawing(null)} onExport={exportGeo} onImportClick={() => fileRef.current && fileRef.current.click()}
        onReset={resetDraft} onSelect={selectZone} onDraw={startDrawing} />;
    } else {
      head = t.about;
      action = <button className="btn ghost small" onClick={(e) => { e.stopPropagation(); setView('list'); setCollapsed(false); }}>{t.allZones}</button>;
      body = <Home t={t} zones={zones} dark={dark} setDark={setDark} onList={() => setView('list')} />;
    }
  }

  return (
    <div className="app">
      <header className="top">
        <div className="grow">
          <h1>{t.title}</h1>
          <p className="sub">{t.subtitle}</p>
        </div>
        {EDIT && <button className={'btn small' + (mode === 'edit' ? '' : ' ghost')} aria-pressed={mode === 'edit'} onClick={toggleMode}>{mode === 'edit' ? t.stopEdit : t.edit}</button>}
        <div className="seg" role="group" aria-label="Språk / Language">
          <button className={lang === 'sv' ? 'on' : ''} onClick={() => setLangP('sv')}>SV</button>
          <button className={lang === 'en' ? 'on' : ''} onClick={() => setLangP('en')}>EN</button>
        </div>
      </header>
      <div className="stage">
        <div className="mapwrap">
          <div id="map" ref={mapEl} />
          {toast && <div className="toast" role="status">{toast}</div>}
        </div>
        <aside className={'sheet' + (collapsed && !drawing ? ' collapsed' : '')} aria-label="Info">
          {drawing
            ? <DrawBar t={t} n={drawing.pts.length} name={sel ? sel.name : ''} onUndo={undoPoint} onCancel={cancelDrawing} onSave={finishDrawing} />
            : <React.Fragment>
                <div className="sheet-head" onClick={() => { if (isMobile()) setCollapsed((c) => !c); }}>
                  <span className="handle" />
                  <h2>{head}</h2>
                  {action}
                </div>
                <div className="sheet-body">{body}</div>
              </React.Fragment>}
        </aside>
      </div>
      <input ref={fileRef} type="file" accept=".geojson,.json,application/geo+json,application/json" hidden onChange={onImportFile} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
