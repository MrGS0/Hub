<style>
/* Kedjeklang – stilmall
   Idé: appen används ute i skogen, ofta i solljus och med en hand.
   Stora tryckytor, hög kontrast, siffror i smal och tydlig skylt-typografi.

:root {
  color-scheme: light;
  --bg: #edf1ed;
  --surface: #ffffff;
  --surface-2: #f5f7f4;
  --ink: #142019;
  --ink-2: #48574e;
  --ink-3: #6f7d75;
  --line: #d2dbd4;
  --pine: #1c3a2b;
  --pine-2: #2a5340;
  --pine-ink: #eaf2ed;
  --pine-ink-2: #a9c2b3;
  --band: #f5b700;
  --band-ink: #231b00;
  --danger: #b3261e;
  --ok: #1f7a45;
  --focus: #1e66d0;
  --series-1: #2a78d6;

  /* Resultatfärger: blå = under par, grå = par, röd = över par */
  --sc-eagle-bg: #1c5cab; --sc-eagle-ink: #ffffff;
  --sc-birdie-bg: #b7d3f6; --sc-birdie-ink: #0d366b;
  --sc-par-bg: transparent; --sc-par-ink: var(--ink);
  --sc-bogey-bg: #f6cbc5; --sc-bogey-ink: #6b1915;
  --sc-double-bg: #c0393a; --sc-double-ink: #ffffff;
  --bar-eagle: #1c5cab; --bar-birdie: #5598e7; --bar-par: #a3a5a0; --bar-bogey: #e66767; --bar-double: #b52f2f;

  --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --r-s: 8px;
  --r-m: 14px;
  --tabbar-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e1511;
    --surface: #16201a;
    --surface-2: #1c2821;
    --ink: #e5ece7;
    --ink-2: #b2c0b7;
    --ink-3: #8a998f;
    --line: #2b3a31;
    --pine: #1f4231;
    --pine-2: #2c5a43;
    --danger: #f0776e;
    --ok: #5cc48a;
    --focus: #7fb2ff;
    --series-1: #3987e5;
    --sc-eagle-bg: #6da7ec; --sc-eagle-ink: #0d2240;
    --sc-birdie-bg: #1f4f8c; --sc-birdie-ink: #e3eefc;
    --sc-bogey-bg: #6e2523; --sc-bogey-ink: #fbe3e0;
    --sc-double-bg: #e66767; --sc-double-ink: #2a0606;
    --bar-eagle: #6da7ec; --bar-birdie: #3a7fd0; --bar-par: #6b6d68; --bar-bogey: #c45252; --bar-double: #f08a8a;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--font);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.1; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 0.75em; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.icon { display: inline-flex; width: 1.4em; height: 1.4em; flex: none; }
.icon svg { width: 100%; height: 100%; }

/* ---------- Skal ---------- */

#app {
  max-width: 640px;
  margin: 0 auto;
  min-height: 100dvh;
  padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 24px);
}
body[data-view="play"] #app { padding-bottom: calc(var(--safe-b) + 24px); }
body.has-strip #app { padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 76px); }

.tabbar {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
}
.tabbar-inner { display: flex; width: 100%; max-width: 640px; }
.tabbar a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 9px 0 8px;
  min-height: var(--tabbar-h);
  text-decoration: none;
  color: var(--ink-3);
  font-size: 0.75rem;
  font-weight: 500;
}
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a[aria-current="page"] .icon { color: var(--pine-2); }
@media (prefers-color-scheme: dark) { .tabbar a[aria-current="page"] .icon { color: var(--band); } }
body[data-view="play"] .tabbar, body[data-view="play"] .active-strip { display: none; }

.active-strip {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--tabbar-h) + var(--safe-b));
  z-index: 19;
  display: flex;
  justify-content: center;
  padding: 0 12px 8px;
  pointer-events: none;
}
.active-strip a {
  pointer-events: auto;
  width: 100%;
  max-width: 616px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--r-m);
  background: var(--pine);
  color: var(--pine-ink);
  text-decoration: none;
  box-shadow: 0 6px 18px rgba(10, 30, 20, 0.25);
}
.active-strip .strip-hole { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--band); line-height: 1; }
.active-strip .strip-text { flex: 1; min-width: 0; }
.active-strip .strip-text strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.active-strip .strip-text span { font-size: 0.85rem; color: var(--pine-ink-2); }

.page-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 56px;
  padding: 8px 16px;
  background: var(--bg);
}
.page-header h1 { flex: 1; font-size: 1.6rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-header .icon-btn:first-child { margin-left: -10px; }
.header-actions { display: flex; gap: 4px; }

.wordmark {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2.1rem;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.wordmark .logo { display: inline-flex; width: 34px; height: 34px; }
.wordmark .logo svg { width: 100%; height: 100%; }

.content { padding: 0 16px; }
.section { margin: 22px 0 0; }
.section > h2 { margin: 0 0 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section-head h2 { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 0.875rem; }
.note { color: var(--ink-2); font-size: 0.9rem; }
.warn {
  background: color-mix(in srgb, var(--band) 18%, var(--surface));
  border-left: 4px solid var(--band);
  padding: 10px 12px;
  border-radius: var(--r-s);
  font-size: 0.92rem;
  margin: 8px 0;
}
.error-box { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }

/* ---------- Knappar ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 18px;
  border-radius: var(--r-m);
  border: 1.5px solid transparent;
  background: var(--surface);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--band); color: var(--band-ink); }
.btn.dark { background: var(--pine); color: var(--pine-ink); }
.btn.outline { border-color: var(--line); background: var(--surface); }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }
.btn.block { display: flex; width: 100%; }
.btn.big { min-height: 58px; font-size: 1.1rem; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  text-decoration: none;
}
.icon-btn:active { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--pine-2); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-color-scheme: dark) { .link-btn { color: var(--band); } }

/* ---------- Listor ---------- */

.list {
  background: var(--surface);
  border-radius: var(--r-m);
  border: 1px solid var(--line);
  overflow: hidden;
}
.list > * + * { border-top: 1px solid var(--line); }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  min-height: 60px;
  text-decoration: none;
  color: inherit;
  background: none;
  border: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.row:active { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { color: var(--ink-2); font-size: 0.875rem; display: block; }
.row-end { text-align: right; flex: none; }
.row-big { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1; }
.row .chev { color: var(--ink-3); }
.tag {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  vertical-align: 1px;
}
.tag.live { background: var(--band); border-color: var(--band); color: var(--band-ink); }

.empty {
  text-align: center;
  padding: 28px 18px;
  color: var(--ink-2);
  border: 1.5px dashed var(--line);
  border-radius: var(--r-m);
}
.empty .btn { margin-top: 6px; }

/* ---------- Formulär ---------- */

.field { display: grid; gap: 6px; margin: 0 0 14px; }
.field > span { font-weight: 600; font-size: 0.92rem; }
input[type="text"], input[type="number"], input[type="search"], select {
  width: 100%;
  min-height: 48px;
  padding: 10px 12px;
  border-radius: var(--r-s);
  border: 1.5px solid var(--line);
  background: var(--surface);
}
input:focus, select:focus { border-color: var(--focus); outline: none; }
.inline-form { display: flex; gap: 8px; }
.inline-form input { flex: 1; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; }
.switch input { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; margin: 0; cursor: pointer; flex: none; transition: background 0.15s; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
.switch input:checked { background: var(--pine-2); }
.switch input:checked::after { transform: translateX(18px); }
@media (prefers-color-scheme: dark) { .switch input:checked { background: var(--ok); } }

.choice-list .row { cursor: pointer; }
.check {
  width: 26px; height: 26px; flex: none;
  border-radius: 8px;
  border: 2px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--band-ink);
}
.row[aria-pressed="true"] .check, .row[aria-checked="true"] .check { background: var(--band); border-color: var(--band); }

.segmented { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.segmented button {
  flex: 1 0 auto;
  border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap;
}
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

/* ---------- Hem ---------- */

.home-top { padding: 18px 16px 4px; }
.resume {
  display: block;
  background: var(--pine);
  color: var(--pine-ink);
  border-radius: var(--r-m);
  padding: 16px;
  text-decoration: none;
}
.resume-top { display: flex; align-items: flex-end; gap: 14px; }
.resume-hole { font-family: var(--font-display); font-weight: 700; font-size: 3.4rem; line-height: 0.85; color: var(--band); }
.resume-hole small { display: block; font-size: 0.95rem; font-weight: 600; color: var(--pine-ink-2); margin-bottom: 4px; }
.resume h2 { color: var(--pine-ink); }
.resume p { color: var(--pine-ink-2); margin: 4px 0 0; font-size: 0.9rem; }
.resume .btn { margin-top: 14px; }

.welcome { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; }
.welcome h2 { margin-bottom: 6px; }

/* ---------- Rundvy: hålskylten ---------- */

.play-top {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px 6px 8px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
}
.play-top .title { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: 0.95rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.tee-sign {
  margin: 0 12px;
  background: var(--pine);
  color: var(--pine-ink);
  border-radius: 18px;
  padding: 14px 16px 12px;
  position: relative;
  overflow: hidden;
}
/* Korgbandet: en gul rand längs skyltens överkant, som på en riktig korg */
.tee-sign::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--band); }
.sign-main { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 12px; }
.sign-hole-label { font-size: 0.85rem; color: var(--pine-ink-2); font-weight: 600; }
.sign-hole {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 6.2rem;
  line-height: 0.78;
  color: var(--band);
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  margin-top: 6px;
}
.sign-facts { justify-self: end; text-align: right; display: grid; gap: 2px; }
.sign-facts b { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.sign-facts span { font-size: 0.8rem; color: var(--pine-ink-2); font-weight: 500; }
.sign-of { align-self: start; padding-top: 22px; color: var(--pine-ink-2); font-size: 0.85rem; }

.rangefinder {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
}
.rf-value { font-family: var(--font-display); font-weight: 600; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.rf-label { font-size: 0.8rem; color: var(--pine-ink-2); }
.rf-main { flex: 1; min-width: 0; }
.rf-btn {
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  background: transparent;
  color: var(--pine-ink);
  border-radius: 999px;
  min-height: 40px;
  padding: 0 14px;
  font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer;
}
.rf-btn.on { background: var(--band); color: var(--band-ink); border-color: var(--band); }

.hole-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 12px 12px 4px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.hole-strip::-webkit-scrollbar { display: none; }
.hole-chip {
  flex: none;
  min-width: 40px;
  height: 40px;
  padding: 0 6px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.15rem;
  cursor: pointer;
  scroll-snap-align: center;
  color: var(--ink-2);
}
.hole-chip.done { background: var(--surface-2); color: var(--ink); border-color: transparent; }
.hole-chip.current { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Spelare och resultat ---------- */

.players { margin: 10px 12px 0; }
.player {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: 10px 10px 10px 14px;
  margin-bottom: 8px;
}
.player-head { display: flex; align-items: center; gap: 10px; min-height: 64px; }
.player-name { flex: 1; min-width: 0; }
.player-name strong { display: block; font-size: 1.05rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.player-name span { color: var(--ink-2); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

.stepper { display: flex; align-items: center; gap: 4px; }
.step-btn {
  width: 52px; height: 52px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--surface-2);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.step-btn:active { background: var(--line); }
.score-num {
  width: 58px; height: 58px;
  border-radius: 14px;
  border: 0;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2rem;
  line-height: 1;
  cursor: pointer;
  background: var(--surface-2);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.score-num small { font-family: var(--font); font-size: 0.6rem; font-weight: 600; margin-top: 2px; }
.score-num.ghost { color: var(--ink-3); background: transparent; border: 2px dashed var(--line); }

.sc-ace, .sc-eagle { background: var(--sc-eagle-bg); color: var(--sc-eagle-ink); }
.sc-birdie { background: var(--sc-birdie-bg); color: var(--sc-birdie-ink); }
.sc-par { background: var(--surface-2); color: var(--ink); }
.sc-bogey { background: var(--sc-bogey-bg); color: var(--sc-bogey-ink); }
.sc-double { background: var(--sc-double-bg); color: var(--sc-double-ink); }

/* Detaljerad inmatning */
.throws { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; min-height: 30px; align-items: center; }
.throw-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px 3px 4px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 0.85rem;
  font-weight: 600;
}
.throw-chip i { font-style: normal; display: inline-flex; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); align-items: center; justify-content: center; font-size: 0.72rem; }
.throw-chip.ob { border-color: var(--danger); color: var(--danger); }
.throw-chip.basket { background: var(--band); border-color: var(--band); color: var(--band-ink); }
.zone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.zone-btn {
  min-height: 52px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.1;
  padding: 4px;
}
.zone-btn small { font-weight: 400; font-size: 0.7rem; color: var(--ink-3); margin-top: 2px; }
.zone-btn.ob { color: var(--danger); }
.zone-btn.basket { grid-column: span 2; background: var(--band); border-color: var(--band); color: var(--band-ink); }
.zone-btn.basket small { color: var(--band-ink); opacity: 0.75; }
.zone-btn:active { filter: brightness(0.94); }
.detail-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.expand-btn { background: none; border: 0; padding: 6px 0; color: var(--ink-2); font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.play-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 12px 0; }
.hole-nav { display: flex; gap: 8px; margin: 12px 12px 0; }
.hole-nav .btn { flex: 1; }
.hole-nav .btn.next { flex: 2; }

.panel { margin: 10px 12px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; }
.panel h3 { margin-bottom: 8px; }
.map { height: 260px; border-radius: var(--r-s); overflow: hidden; background: var(--surface-2); z-index: 0; }
.map.tall { height: 340px; }
.pos-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pos-row .btn { flex: 1; min-height: 44px; font-size: 0.9rem; padding: 0 10px; }
.throw-list { margin: 10px 0 0; padding: 0; list-style: none; }
.throw-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.throw-list li b { font-family: var(--font-display); font-size: 1.3rem; }

/* Kartmarkörer */
.mk { display: flex; align-items: center; justify-content: center; border-radius: 50%; font-family: var(--font-display); font-weight: 700; font-size: 13px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
.mk-tee { background: #1c3a2b; color: #fff; border-radius: 5px; }
.mk-basket { background: #f5b700; color: #231b00; }
.mk-me { background: #2a78d6; border: 3px solid #fff; }
.mk-course { background: #1c3a2b; color: #f5b700; }

/* ---------- Mätark (bottom sheet) ---------- */

.sheet-backdrop { position: fixed; inset: 0; background: rgba(5, 15, 10, 0.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%;
  max-width: 640px;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 18px 18px calc(18px + var(--safe-b));
  max-height: 90dvh;
  overflow-y: auto;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.measure-value { font-family: var(--font-display); font-weight: 700; font-size: 4.4rem; line-height: 1; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
.measure-acc { color: var(--ink-2); font-size: 0.9rem; }
.measure-steps { margin: 8px 0 14px; padding-left: 20px; color: var(--ink-2); }

/* ---------- Scorekort ---------- */

.scorecard-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); }
table.scorecard { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scorecard th, .scorecard td { padding: 7px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.scorecard thead th { font-size: 0.82rem; font-weight: 600; color: var(--ink-2); position: sticky; top: 0; background: var(--surface); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scorecard tbody th { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; width: 44px; }
.scorecard td.par { color: var(--ink-2); width: 40px; }
.scorecard .cell { display: inline-flex; min-width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 9px; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
.scorecard tfoot td, .scorecard tfoot th { font-weight: 700; border-bottom: 0; font-family: var(--font-display); font-size: 1.2rem; }
.scorecard tfoot .diff { display: block; font-size: 0.85rem; color: var(--ink-2); font-family: var(--font); font-weight: 600; }

.leader { display: grid; gap: 8px; }
.leader-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; }
.leader-pos { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; width: 22px; color: var(--ink-3); }
.leader-row .row-main strong { font-size: 1.05rem; }
.leader-score { text-align: right; }
.leader-score b { font-family: var(--font-display); font-size: 2rem; line-height: 1; display: block; }
.leader-score span { color: var(--ink-2); font-size: 0.85rem; }

/* ---------- Statistik ---------- */

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles.two { grid-template-columns: repeat(2, 1fr); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; min-width: 0; }
.tile b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { display: block; font-size: 0.82rem; color: var(--ink-2); margin-top: 4px; }
.tile em { display: block; font-style: normal; font-size: 0.75rem; color: var(--ink-3); margin-top: 2px; }

.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-box .axis text { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.chart-box .grid line { stroke: var(--line); stroke-width: 1; }
.chart-box .zero { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-tip {
  position: absolute;
  pointer-events: none;
  background: var(--ink);
  color: var(--bg);
  padding: 6px 9px;
  border-radius: 8px;
  font-size: 0.8rem;
  line-height: 1.3;
  white-space: nowrap;
  transform: translate(-50%, calc(-100% - 10px));
  z-index: 2;
}
details.table-view { margin-top: 8px; font-size: 0.9rem; }
details.table-view summary { cursor: pointer; color: var(--ink-2); font-weight: 600; padding: 4px 0; }
details.table-view table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
details.table-view td, details.table-view th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }
details.table-view td:last-child, details.table-view th:last-child { text-align: right; }

.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 112px 1fr 72px; align-items: center; gap: 10px; font-size: 0.9rem; }
.bar-row .bar-track { height: 14px; border-radius: 0 4px 4px 0; position: relative; }
.bar-row .bar-fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .bar-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bar-row .bar-label { display: flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.hole-bars { display: grid; gap: 4px; }
.hole-bar { display: grid; grid-template-columns: 34px 1fr 1fr 52px; align-items: center; gap: 0; font-size: 0.85rem; min-height: 26px; }
.hole-bar .lbl { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.hole-bar .neg { display: flex; justify-content: flex-end; border-right: 1px solid var(--ink-3); height: 14px; }
.hole-bar .pos { display: flex; justify-content: flex-start; height: 14px; }
.hole-bar .neg div { background: var(--bar-birdie); border-radius: 4px 0 0 4px; height: 100%; }
.hole-bar .pos div { background: var(--bar-bogey); border-radius: 0 4px 4px 0; height: 100%; }
.hole-bar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* ---------- Banredigering ---------- */

.hole-table { width: 100%; border-collapse: collapse; }
.hole-table th { text-align: left; font-size: 0.8rem; color: var(--ink-2); font-weight: 600; padding: 4px 4px 6px; }
.hole-table td { padding: 4px; border-top: 1px solid var(--line); vertical-align: middle; }
.hole-table input { min-height: 42px; padding: 6px 8px; }
.hole-table td.lbl input { width: 54px; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; text-align: center; }
.hole-table td.par select { width: 64px; min-height: 42px; padding: 6px; }
.hole-table td.len input { width: 76px; }
.hole-table td.gps { font-size: 0.75rem; color: var(--ink-3); white-space: nowrap; }
.hole-table td.gps .ok { color: var(--ok); font-weight: 600; }
.sticky-save { position: sticky; bottom: calc(var(--tabbar-h) + var(--safe-b) + 8px); margin-top: 16px; z-index: 5; }

/* ---------- Dialoger och meddelanden ---------- */

dialog.dialog {
  border: 0;
  border-radius: 18px;
  padding: 20px;
  width: min(92vw, 420px);
  background: var(--surface);
  color: var(--ink);
}
dialog.dialog::backdrop { background: rgba(5, 15, 10, 0.5); }
dialog.dialog h2 { margin-bottom: 10px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  background: var(--ink);
  color: var(--bg);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  max-width: min(92vw, 520px);
  transition: opacity 0.18s, transform 0.18s;
  font-size: 0.95rem;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast-action { background: none; border: 0; color: var(--band); font-weight: 700; cursor: pointer; padding: 4px; }

.spinner { display: inline-block; width: 20px; height: 20px; border: 2.5px solid var(--line); border-top-color: var(--pine-2); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -4px; }
@media (prefers-color-scheme: dark) { .spinner { border-top-color: var(--band); } }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; gap: 10px; padding: 18px 4px; color: var(--ink-2); }

.leaflet-container { font-family: var(--font); }
.leaflet-control-attribution { font-size: 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media (min-width: 700px) {
  .tee-sign, .players, .play-tools, .hole-nav, .panel { margin-left: 16px; margin-right: 16px; }
}

body.has-strip .sticky-save { bottom: calc(var(--tabbar-h) + var(--safe-b) + 78px); }

/* ---------- Konton och online ---------- */

.home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.account-chip { text-decoration: none; display: inline-flex; }
.small-btn { min-height: 38px; padding: 0 14px; font-size: 0.9rem; }
.avatar {
  width: 40px; height: 40px; flex: none;
  border-radius: 50%;
  background: var(--pine); color: var(--band);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
}
.avatar .icon { color: var(--pine-ink); }
.avatar.small { width: 36px; height: 36px; font-size: 1rem; }

.play-top .title-wrap { flex: 1; min-width: 0; text-align: center; }
.play-top .title-wrap .title { display: block; }
.title-sub { font-size: 0.75rem; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink-3); flex: none; }
.sync-dot.synced { background: var(--ok); }
.sync-dot.pending { background: var(--band); }
.sync-dot.error { background: var(--danger); }
.you { color: var(--ink-2); font-weight: 500; }
.add-player { margin: 0 12px 4px; }
@media (min-width: 700px) { .add-player { margin-left: 16px; margin-right: 16px; } }

.code-input {
  font-family: var(--font-display); font-weight: 700;
  font-size: 2rem; letter-spacing: 0.3em; text-transform: uppercase; text-align: center;
  min-height: 64px !important;
}
.invite-code { font-family: var(--font-display); font-weight: 700; font-size: 3.2rem; letter-spacing: 0.16em; text-align: center; margin: 6px 0 10px; }
.qr { background: #fff; border-radius: 12px; padding: 6px; width: min(230px, 66vw); margin: 0 auto; }
.qr svg { display: block; width: 100%; height: auto; }
.online-box {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 12px 14px; margin-top: 4px;
}
.online-box strong { display: block; }

/* ---------- Rita banan på kartan ---------- */

.map-tools { margin-top: 10px; }
.map-hole-nav { display: flex; align-items: center; gap: 8px; }
.map-hole-label { flex: 1; text-align: center; }
.map-hole-label b { display: block; font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
.map-hole-label span { font-size: 0.85rem; color: var(--ink-2); }
.map-hint { margin: 8px 0 10px; min-height: 2.6em; }
.pos-btn { background: none; border: 0; padding: 4px 2px; text-align: left; cursor: pointer; font: inherit; color: inherit; font-size: 0.75rem; line-height: 1.35; }
.hole-table tr.editing td { background: color-mix(in srgb, var(--band) 16%, transparent); }
.tag.map-tag { background: color-mix(in srgb, var(--band) 28%, var(--surface)); border-color: var(--band); color: var(--ink); }

</style>
</head>
